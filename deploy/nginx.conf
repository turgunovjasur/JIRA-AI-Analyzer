# JIRA-AI-Analyzer — Nginx reverse proxy konfiguratsiyasi
#
# Foydalanish:
#   1. Bu faylni /etc/nginx/sites-available/jira-ai-analyzer ga ko'chiring
#   2. example.com ni o'z domeningizga almashtiring
#   3. Let's Encrypt: certbot --nginx -d example.com
#   4. sudo ln -s /etc/nginx/sites-available/jira-ai-analyzer /etc/nginx/sites-enabled/
#   5. sudo nginx -t && sudo systemctl reload nginx

upstream frontend {
    server 127.0.0.1:3000;
}

upstream backend {
    server 127.0.0.1:8000;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name example.com;

    # TLS — Let's Encrypt yoki o'z sertifikat
    ssl_certificate     /etc/letsencrypt/live/example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Security headers (FAZA 1 dagi Python middleware ni to'ldiradi)
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options    nosniff                                always;
    add_header X-Frame-Options           DENY                                   always;
    add_header Referrer-Policy           "strict-origin-when-cross-origin"      always;

    # Upload limit (JIRA webhook va settings uchun)
    client_max_body_size 10m;

    # Frontend (Next.js)
    location / {
        proxy_pass         http://frontend;
        proxy_http_version 1.1;
        proxy_set_header   Upgrade $http_upgrade;
        proxy_set_header   Connection "upgrade";
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    # Backend API va webhook endpointlar
    location ~ ^/(api|webhook|health|settings|manual|rpc)/ {
        proxy_pass         http://backend;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
        proxy_set_header   X-Real-IP $remote_addr;
        proxy_set_header   X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    # Health check — monitoring uchun ochiq
    location = /health {
        proxy_pass         http://backend/health;
        proxy_http_version 1.1;
        access_log         off;
    }
}
