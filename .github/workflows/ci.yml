name: CI

on:
  push:
    branches: [main, dev1]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Docker image quriladi + runtime deps import qilinadi.
  # Bu job aynan BLOCKER-1 (buzuq requirements.txt) turdagi xatolarni ushlaydi:
  # google-genai / cryptography yo'q bo'lsa yoki dep resolver yiqilsa — bu yerda ko'rinadi.
  backend-build:
    name: Backend image + deps
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build backend image
        run: docker build -f Dockerfile.backend -t qa-backend .
      - name: Import runtime deps (must not raise)
        run: |
          docker run --rm qa-backend python -c "
          from google import genai
          from google.genai import types
          from cryptography.fernet import Fernet
          import fastapi, uvicorn, starlette, jira, pandas
          import psycopg, psycopg_pool, pydantic, requests
          print('runtime deps import OK')
          "

  # pytest — Postgres service bilan (DB testlari uchun majburiy).
  # BLOKLOVCHI merge-gate: suite to'liq yashil (2026-07-03: eskirgan testlar
  # tuzatildi, engine qamrovi eval golden-set bilan qo'shildi). Fail = merge yo'q.
  tests:
    name: pytest (Postgres)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: jira_ai_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      APP_TEST_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/jira_ai_test
      # Import-vaqtidagi init_db bloklab qolmasligi uchun (conftest baribir override qiladi):
      APP_POSTGRES_DSN: postgresql://postgres:postgres@localhost:5432/jira_ai_test
      APP_CREDENTIALS_MASTER_KEY: ci-test-master-key-not-a-real-secret
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt
      - name: Ruff lint
        run: python -m ruff check .
      - name: Apply base schema
        # conftest _align_postgres_test_schema ALTER'lari task_processing/companies
        # mavjudligini talab qiladi; init_db (run_migrations) qolgan runtime jadvallarni
        # (job_queue va h.k.) test ichida qo'shadi.
        run: psql "$APP_TEST_POSTGRES_DSN" -f database/postgresql/001_initial_schema.sql -q
      - name: Run pytest
        run: python -m pytest -q
      - name: AI eval harness (golden set)
        # Prompt/parser/scoring regressiyalarini ushlaydi — DB va tarmoq kerak emas.
        run: python eval/run_eval.py

  # Frontend (Next.js) build — kompilyatsiya/tayp xatolarini ushlaydi.
  frontend-build:
    name: Frontend build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      BACKEND_API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_BACKEND_API_BASE_URL: http://backend:8000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Lint (eslint)
        run: npm run lint
      - name: Unit tests (vitest)
        run: npm run test
      - name: Build
        run: npm run build
