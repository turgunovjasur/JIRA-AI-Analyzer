# Barcha servislar uchun umumiy log cheklovi: har container max 3 x 10MB json log
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jira_ai_analyzer}
      POSTGRES_USER: ${POSTGRES_USER:-jira_ai_analyzer}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/postgresql/001_initial_schema.sql:/docker-entrypoint-initdb.d/001_initial_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-jira_ai_analyzer}"]
      interval: 5s
      timeout: 5s
      retries: 10
    logging: *default-logging

  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    env_file: .env
    environment:
      APP_POSTGRES_DSN: postgresql://${POSTGRES_USER:-jira_ai_analyzer}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jira_ai_analyzer}
      APP_WEBHOOK_EXECUTION_MODE: queue
      APP_USE_BACKEND_API: "true"
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - app_data:/app/data
    # /health endpoint DB/servis holatini tekshiradi (unhealthy bo'lsa 503 qaytaradi)
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    mem_limit: 1g
    logging: *default-logging

  # Gorizontal scale: docker compose up -d --scale worker=3 (batafsil: docs/SCALING.md)
  # container_name YO'Q va port ochilmagan — replikalar to'qnashmaydi.
  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    restart: unless-stopped
    command: ["python", "-m", "services.worker.main"]
    # SIGTERM'da worker joriy jobni (multi-agent run ~3-8 daqiqa) tugatib to'xtaydi;
    # bu vaqt tugasa job 'running' qoladi va reaper uni qayta navbatga qo'yadi.
    stop_grace_period: 600s
    env_file: .env
    environment:
      APP_POSTGRES_DSN: postgresql://${POSTGRES_USER:-jira_ai_analyzer}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-jira_ai_analyzer}
      APP_WEBHOOK_EXECUTION_MODE: queue
      APP_USE_BACKEND_API: "true"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_data:/app/data
    # Liveness: worker loop har ~60s heartbeat faylga touch qiladi (container-lokal /tmp).
    # Uzun job paytida (~8 daqiqa) heartbeat yangilanmaydi — shu uchun chegara 15 daqiqa.
    healthcheck:
      test: ["CMD-SHELL", "find /tmp/qa_worker_heartbeat -mmin -15 2>/dev/null | grep -q ."]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 60s
    mem_limit: 2g
    logging: *default-logging

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      BACKEND_API_BASE_URL: http://backend:8000
      NEXT_PUBLIC_BACKEND_API_BASE_URL: http://backend:8000
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    logging: *default-logging

volumes:
  postgres_data:
  app_data:
